line-length = 100
indent-width = 4
target-version = "py310"
extend-exclude = [
    "dependencias",
    "distribuicao",
    "dados",
    "historico",
    "transferencia",
    "trabalho",
]

[lint]
select = ["E401", "E701", "E702", "E9", "F821", "F822", "F823"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
